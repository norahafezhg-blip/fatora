<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام الفواتير الاحترافي - HG</title>
    <style>
        /* إعدادات الطباعة والمقاس A4 */
        @page { size: A4; margin: 10mm; }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
        
        .invoice-wrapper { 
            width: 210mm; /* عرض ورقة A4 */
            min-height: 297mm;
            margin: 20px auto; 
            padding: 15mm;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }

        .logo-container { text-align: left; margin-bottom: 10px; }
        .logo-container img { width: 150px; }

        .header-info-table { margin: 0 auto 15px auto; border-collapse: collapse; width: 450px; }
        .header-info-table td { border: 1px solid #000; padding: 8px; text-align: center; font-weight: bold; font-size: 16px; }
        .label-cell { background-color: #d9d9d9; width: 40%; }
        .input-cell { background-color: #fff; width: 60%; }

        .title-blue { text-align: center; color: #1c4587; font-size: 28px; font-weight: bold; text-decoration: underline; margin-bottom: 20px; }

        .main-table, .footer-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .main-table th, .main-table td, .footer-table td { border: 1px solid #000; padding: 10px; text-align: center; font-weight: bold; font-size: 14px; }
        .main-table th { background-color: #d9d9d9; }
        
        /* توزيع الأعمدة */
        .col-del { width: 35px; border: none !important; }
        .col-1 { width: 30%; } .col-2 { width: 25%; } .col-3 { width: 10%; } .col-4 { width: 20%; } .col-5 { width: 15%; } 

        input { width: 95%; border: none; text-align: center; font-weight: bold; font-size: 14px; outline: none; background: transparent; }

        /* رسالة جاري الحفظ */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            z-index: 1000;
            text-align: center;
            padding-top: 200px;
            font-size: 24px;
            font-weight: bold;
            color: #1c4587;
        }

        .btn-del { background: #ff4d4d; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 2px 8px; font-size: 12px; }
        .no-print { text-align: center; margin: 30px 0; }
        .btn { padding: 12px 30px; cursor: pointer; border: none; border-radius: 5px; color: #fff; font-weight: bold; margin: 0 10px; font-size: 16px; }
        
        .add-row-container { text-align: right; margin: 10px 0; padding-right: 35px; }
        .btn-add { background-color: #f0f0f0; border: 1px solid #ccc; padding: 6px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }

        @media print { 
            body { background-color: #fff; }
            .invoice-wrapper { margin: 0; border: none; box-shadow: none; width: 100%; }
            .no-print, .add-row-container, .col-del, .btn-del { display: none !important; } 
            .main-table td.col-del, .main-table th.col-del { border: none !important; }
        }
    </style>
</head>
<body>

<div id="loadingOverlay">⏳ جاري حفظ الفاتورة... برجاء الانتظار</div>

<div class="invoice-wrapper">
    <div class="logo-container">
        <img src="LOGO (1).png" alt="HG Logo">
    </div>

    <table class="header-info-table">
        <tr><td class="label-cell">اسم العميل</td><td class="input-cell"><input type="text" id="customerName" placeholder="اسم العميل"></td></tr>
        <tr><td class="label-cell">تاريخ الفاتورة</td><td class="input-cell"><input type="text" id="invoiceDate"></td></tr>
        <tr><td class="label-cell">رقم الفاتورة</td><td class="input-cell" style="color: red;"><input type="text" id="invoiceNo" readonly></td></tr>
    </table>

    <div class="title-blue">فاتورة الأسعار</div>

    <datalist id="productsList"></datalist>

    <table class="main-table" id="itemsTable">
        <thead>
            <tr>
                <th class="col-del"></th>
                <th class="col-1">اسم الصنف</th>
                <th class="col-2">الاسم الكودى</th>
                <th class="col-3">الكمية</th>
                <th class="col-4">سعر الكيلو</th>
                <th class="col-5">سعر الكمية</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="col-del"><button class="btn-del" onclick="deleteRow(this)">X</button></td>
                <td><input type="text" class="p-name" list="productsList" onchange="autoFill(this)"></td>
                <td><input type="text" class="p-code"></td>
                <td><input type="number" class="p-qty" oninput="calculate()"></td>
                <td><input type="number" class="p-price" oninput="calculate()"></td>
                <td class="p-total">0.00</td>
            </tr>
        </tbody>
    </table>

    <div class="add-row-container">
        <button class="btn-add" onclick="addRow()">+ إضافة صنف جديد</button>
    </div>

    <table class="footer-table" style="margin-top: -1px;">
        <tr>
            <td class="col-del" style="border:none;"></td>
            <td class="col-1" style="border: none;"></td>
            <td class="col-2" style="background:#d9d9d9">اجمالي الكمية بالكيلو</td>
            <td class="col-3" id="totalKg">0</td>
            <td class="col-4" style="background:#d9d9d9">السعر الاجمالي قبل الخصم</td>
            <td class="col-5" id="subTotal">0.00</td>
        </tr>
        <tr>
            <td class="col-del" style="border:none;"></td>
            <td colspan="3" style="border: none;"></td>
            <td class="col-4" style="background:#d9d9d9">نسبة الخصم %</td>
            <td class="col-5"><input type="number" id="discPercent" value="0" oninput="calculate()"></td>
        </tr>
        <tr>
            <td class="col-del" style="border:none;"></td>
            <td colspan="3" style="border: none;"></td>
            <td class="col-4" style="background:#d9d9d9">قيمة الخصم نقداً</td>
            <td class="col-5" id="discValue">0.00</td>
        </tr>
        <tr>
            <td class="col-del" style="border:none;"></td>
            <td colspan="3" style="border: none;"></td>
            <td class="col-4" style="background:#d9d9d9">السعر الإجمالي بعد الخصم</td>
            <td class="col-5" id="finalTotal" style="color: red; background: yellow;">0.00</td>
        </tr>
    </table>

    <div class="no-print">
        <button class="btn" style="background: #28a745;" onclick="saveToSheet()">💾 حفظ في الشيت</button>
        <button class="btn" style="background: #333;" onclick="window.print()">🖨️ طباعة الفاتورة</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwqP84wKOI4r-dsmtndr5L5S-ddIXbhDeLmxJEE89qQAlEymdaUjwqI9pm9gVVTa0twxQ/exec"; 
    let allProducts = [];

    window.onload = function() {
        document.getElementById('invoiceDate').value = new Date().toLocaleDateString('en-GB');
        fetch(WEB_APP_URL).then(res => res.text()).then(num => {
            document.getElementById('invoiceNo').value = isNaN(parseInt(num)) ? 2529 : parseInt(num) + 1;
        });
        fetch(WEB_APP_URL + "?action=getPrices").then(res => res.json()).then(data => {
            allProducts = data;
            const list = document.getElementById('productsList');
            data.forEach(item => {
                let op = document.createElement('option'); op.value = item.name; list.appendChild(op);
            });
        });
    };

    function autoFill(input) {
        const row = input.closest('tr');
        const prod = allProducts.find(p => p.name === input.value);
        if(prod) { row.querySelector('.p-code').value = prod.code; row.querySelector('.p-price').value = prod.price; calculate(); }
    }

    function addRow() {
        const table = document.querySelector("#itemsTable tbody");
        const row = table.insertRow();
        row.innerHTML = `
            <td class="col-del"><button class="btn-del" onclick="deleteRow(this)">X</button></td>
            <td><input type="text" class="p-name" list="productsList" onchange="autoFill(this)"></td>
            <td><input type="text" class="p-code"></td>
            <td><input type="number" class="p-qty" oninput="calculate()"></td>
            <td><input type="number" class="p-price" oninput="calculate()"></td>
            <td class="p-total">0.00</td>`;
    }

    function deleteRow(btn) { btn.closest('tr').remove(); calculate(); }

    function calculate() {
        let kg = 0, sub = 0;
        document.querySelectorAll("#itemsTable tbody tr").forEach(r => {
            const q = parseFloat(r.querySelector(".p-qty").value) || 0;
            const p = parseFloat(r.querySelector(".p-price").value) || 0;
            const t = q * p;
            r.querySelector(".p-total").innerText = t.toFixed(2);
            kg += q; sub += t;
        });
        const dP = parseFloat(document.getElementById("discPercent").value) || 0;
        const dV = sub * (dP / 100);
        document.getElementById("totalKg").innerText = kg;
        document.getElementById("subTotal").innerText = sub.toFixed(2);
        document.getElementById("discValue").innerText = dV.toFixed(2);
        document.getElementById("finalTotal").innerText = (sub - dV).toFixed(2);
    }

    function saveToSheet() {
        const name = document.getElementById("customerName").value;
        if(!name) { alert("من فضلك أدخل اسم العميل"); return; }

        document.getElementById("loadingOverlay").style.display = "block";

        const data = {
            customer: name,
            invoiceDate: document.getElementById("invoiceDate").value,
            invoiceNo: document.getElementById("invoiceNo").value,
            totalKg: document.getElementById("totalKg").innerText,
            subTotal: document.getElementById("subTotal").innerText,
            discPercent: document.getElementById("discPercent").value,
            finalTotal: document.getElementById("finalTotal").innerText,
            items: []
        };

        document.querySelectorAll("#itemsTable tbody tr").forEach(r => {
            data.items.push({
                name: r.querySelector(".p-name").value,
                code: r.querySelector(".p-code").value,
                qty: r.querySelector(".p-qty").value,
                price: r.querySelector(".p-price").value,
                total: r.querySelector(".p-total").innerText
            });
        });

        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) })
        .then(() => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("تم الحفظ بنجاح!");
            
            // إعادة التصفير
            document.getElementById("customerName").value = "";
            document.querySelector("#itemsTable tbody").innerHTML = `
                <tr>
                    <td class="col-del"><button class="btn-del" onclick="deleteRow(this)">X</button></td>
                    <td><input type="text" class="p-name" list="productsList" onchange="autoFill(this)"></td>
                    <td><input type="text" class="p-code"></td>
                    <td><input type="number" class="p-qty" oninput="calculate()"></td>
                    <td><input type="number" class="p-price" oninput="calculate()"></td>
                    <td class="p-total">0.00</td>
                </tr>`;
            document.getElementById("discPercent").value = 0;
            calculate();
            document.getElementById("invoiceNo").value = parseInt(data.invoiceNo) + 1;
        })
        .catch(e => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("حدث خطأ");
        });
    }
</script>
</body>
</html>
